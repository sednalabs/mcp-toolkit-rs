version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "22:00"
      timezone: "Etc/UTC"
    groups:
      rmcp:
        patterns:
          - "rmcp"
      cargo-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "rmcp"

  - package-ecosystem: "cargo"
    directory: "/templates/curated-stdio-intent-server"
    schedule:
      interval: "daily"
      time: "22:15"
      timezone: "Etc/UTC"
    groups:
      rmcp:
        patterns:
          - "rmcp"
      cargo-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "rmcp"

  - package-ecosystem: "cargo"
    directory: "/templates/hosted-http-auth-server"
    schedule:
      interval: "daily"
      time: "22:30"
      timezone: "Etc/UTC"
    groups:
      rmcp:
        patterns:
          - "rmcp"
      cargo-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "rmcp"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "22:45"
      timezone: "Etc/UTC"
    groups:
      github-actions:
        patterns:
          - "*"
