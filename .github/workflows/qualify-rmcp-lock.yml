name: qualify-rmcp-lock
on:
  pull_request:
    paths:
      - .github/workflows/qualify-rmcp-lock.yml
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.0
      - name: Resolve minimal lockfile reconciliation
        run: |
          cargo metadata --format-version 1 > /tmp/metadata.json
          git diff -- Cargo.lock
          echo LOCKFILE_BASE64_BEGIN
          base64 -w 100 Cargo.lock
          echo LOCKFILE_BASE64_END
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rmcp-reconciled-lock
          path: Cargo.lock
