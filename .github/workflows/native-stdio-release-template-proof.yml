name: native-stdio-release-template-proof

on:
  pull_request:
    paths:
      - ".github/workflows/native-stdio-release-template-proof.yml"
      - "scripts/native_release_artifact.py"
      - "scripts/workflow_runner_policy_check.py"
      - "templates/single-crate-public-stdio-server/**"
  workflow_dispatch:

concurrency:
  group: native-stdio-release-template-proof::${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-native-template:
    name: Build template ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    env:
      BINARY_NAME: single-crate-public-stdio-server
      CARGO_CYCLONEDX_VERSION: 0.5.9
      MANIFEST_PATH: templates/single-crate-public-stdio-server/Cargo.toml
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout exact candidate
        # actions/checkout v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Read back exact candidate
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify public workflow policy and helper contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/workflow_runner_policy_check.py --self-test
          python3 scripts/native_release_artifact.py --self-test
          cmp \
            scripts/native_release_artifact.py \
            templates/single-crate-public-stdio-server/scripts/native_release_artifact.py

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Verify native target
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$TARGET"

      - name: Cache cargo artifacts
        # swatinem/rust-cache v2
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: templates/single-crate-public-stdio-server
          key: native-template-${{ matrix.target }}

      - name: Resolve once and build locked
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path "$MANIFEST_PATH"
          cargo build \
            --manifest-path "$MANIFEST_PATH" \
            --release \
            --locked \
            --target "$TARGET" \
            --bin "$BINARY_NAME"

      - name: Capture canonical tool surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-inputs
          python3 scripts/native_release_artifact.py capture \
            --binary "templates/single-crate-public-stdio-server/target/$TARGET/release/$BINARY_NAME" \
            --inventory-output release-inputs/tool-inventory.json \
            --schema-output release-inputs/tool-schema.json

      - name: Install pinned CycloneDX generator
        run: cargo install cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION" --locked

      - name: Generate target-specific CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          cargo cyclonedx \
            --format json \
            --manifest-path "$MANIFEST_PATH" \
            --override-filename release-sbom.cdx.json \
            --spec-version 1.5 \
            --target "$TARGET"
          test -f templates/single-crate-public-stdio-server/release-sbom.cdx.json

      - name: Package and verify exact artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          archive=$(python3 scripts/native_release_artifact.py package \
            --binary "templates/single-crate-public-stdio-server/target/$TARGET/release/$BINARY_NAME" \
            --binary-name "$BINARY_NAME" \
            --target "$TARGET" \
            --candidate "$GITHUB_SHA" \
            --inventory release-inputs/tool-inventory.json \
            --schema release-inputs/tool-schema.json \
            --sbom templates/single-crate-public-stdio-server/release-sbom.cdx.json \
            --output-dir dist)
          python3 scripts/native_release_artifact.py verify \
            --archive "$archive" \
            --binary-name "$BINARY_NAME" \
            --target "$TARGET" \
            --candidate "$GITHUB_SHA"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Attest template proof archive and checksum
        # actions/attest-build-provenance v4.2.2
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/*

      - name: Upload SHA-qualified template proof artifact
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-stdio-template-${{ matrix.target }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  verify-native-template:
    name: Verify template cross-architecture contract
    needs: build-native-template
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BINARY_NAME: single-crate-public-stdio-server
    steps:
      - name: Checkout exact candidate
        # actions/checkout v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Read back exact candidate
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Download exact native template artifacts
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: native-stdio-template-*-${{ github.sha }}
          path: downloaded
          merge-multiple: true

      - name: Verify archives and cross-architecture tool equality
        shell: bash
        run: |
          set -euo pipefail
          x86_archive="downloaded/$BINARY_NAME-x86_64-unknown-linux-gnu-$GITHUB_SHA.tar.gz"
          arm_archive="downloaded/$BINARY_NAME-aarch64-unknown-linux-gnu-$GITHUB_SHA.tar.gz"
          python3 scripts/native_release_artifact.py compare \
            --archive "$x86_archive" \
            --target x86_64-unknown-linux-gnu \
            --archive "$arm_archive" \
            --target aarch64-unknown-linux-gnu \
            --binary-name "$BINARY_NAME" \
            --candidate "$GITHUB_SHA" \
            --output native-template-verification.json
          test "$(find downloaded -maxdepth 1 -type f | wc -l)" -eq 4

      - name: Upload SHA-qualified template verification report
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-stdio-template-verification-${{ github.sha }}
          path: native-template-verification.json
          if-no-files-found: error
          retention-days: 14
