name: native-stdio-release-template-proof

on:
  pull_request:
    paths:
      - ".github/workflows/native-stdio-release-template-proof.yml"
      - ".github/workflows/native-stdio-release-template-attest.yml"
      - "scripts/native_release_artifact.py"
      - "scripts/workflow_runner_policy_check.py"
      - "templates/curated-stdio-intent-server/scripts/workflow_runner_policy_check.py"
      - "templates/hosted-http-auth-server/scripts/workflow_runner_policy_check.py"
      - "templates/single-crate-public-stdio-server/**"
  workflow_call:
  workflow_dispatch:

concurrency:
  group: native-stdio-release-template-proof::${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-template-inputs:
    name: Prepare immutable template inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        # actions/checkout v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Read back exact candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain 1.88.0 (the workspace MSRV)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.88.0

      - name: Resolve one immutable template lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path templates/single-crate-public-stdio-server/Cargo.toml
          test -f templates/single-crate-public-stdio-server/Cargo.lock

      - name: Upload exact template lockfile
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-stdio-template-source-inputs-${{ github.sha }}
          path: templates/single-crate-public-stdio-server/Cargo.lock
          if-no-files-found: error
          retention-days: 14

  build-native-template:
    name: Build template ${{ matrix.target }}
    needs: prepare-template-inputs
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    env:
      BINARY_NAME: single-crate-public-stdio-server
      CARGO_CYCLONEDX_VERSION: 0.5.9
      MANIFEST_PATH: templates/single-crate-public-stdio-server/Cargo.toml
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout exact candidate
        # actions/checkout v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Read back exact candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Prove protected-main ancestry for trusted sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin +refs/heads/main:refs/remotes/origin/main
          source_main_proven=$(python3 scripts/native_release_artifact.py prove-source \
            --repository . \
            --candidate "$GITHUB_SHA" \
            --source-event "$GITHUB_EVENT_NAME" \
            --source-ref "$GITHUB_REF")
          echo "SOURCE_MAIN_PROVEN=$source_main_proven" >> "$GITHUB_ENV"

      - name: Download immutable template lockfile
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: native-stdio-template-source-inputs-${{ github.sha }}
          path: templates/single-crate-public-stdio-server

      - name: Verify public workflow policy and helper contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --break-system-packages PyYAML
          python3 scripts/workflow_runner_policy_check.py \
            --self-test \
            --root . \
            --root templates/curated-stdio-intent-server \
            --root templates/hosted-http-auth-server \
            --root templates/single-crate-public-stdio-server
          python3 scripts/native_release_artifact.py --self-test
          cmp \
            scripts/native_release_artifact.py \
            templates/single-crate-public-stdio-server/scripts/native_release_artifact.py
          for template in \
            curated-stdio-intent-server \
            hosted-http-auth-server \
            single-crate-public-stdio-server
          do
            helper="templates/$template/scripts/workflow_runner_policy_check.py"
            cmp scripts/workflow_runner_policy_check.py "$helper"
            python3 "$helper" --self-test --root "templates/$template"
          done

      - name: Isolate Rustup state on macOS runners
        if: runner.os == 'macOS'
        shell: bash
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain 1.88.0 (the workspace MSRV)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.88.0

      - name: Verify native target
        shell: bash
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$TARGET"

      - name: Cache cargo artifacts
        # swatinem/rust-cache v2
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          workspaces: templates/single-crate-public-stdio-server
          key: native-template-${{ matrix.target }}

      - name: Build locked native binary
        shell: bash
        run: cargo build --manifest-path "$MANIFEST_PATH" --release --locked --target "$TARGET" --bin "$BINARY_NAME"

      - name: Capture canonical tool surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-inputs
          binary_path="templates/single-crate-public-stdio-server/target/$TARGET/release/$BINARY_NAME"
          if [ "$RUNNER_OS" = "Windows" ]; then
            binary_path="$binary_path.exe"
          fi
          python3 scripts/native_release_artifact.py capture \
            --binary "$binary_path" \
            --inventory-output release-inputs/tool-inventory.json \
            --schema-output release-inputs/tool-schema.json

      - name: Install pinned CycloneDX generator
        shell: bash
        run: cargo install cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION" --locked

      - name: Generate target-specific CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          cargo cyclonedx \
            --format json \
            --manifest-path "$MANIFEST_PATH" \
            --override-filename release-sbom.cdx \
            --spec-version 1.5 \
            --target "$TARGET"
          test -f templates/single-crate-public-stdio-server/release-sbom.cdx.json

      - name: Package and verify exact unprivileged proof artifact
        shell: bash
        run: |
          set -euo pipefail
          source_tree=$(git rev-parse HEAD^{tree})
          mkdir -p dist
          binary_path="templates/single-crate-public-stdio-server/target/$TARGET/release/$BINARY_NAME"
          if [ "$RUNNER_OS" = "Windows" ]; then
            binary_path="$binary_path.exe"
          fi
          archive=$(python3 scripts/native_release_artifact.py package \
            --binary "$binary_path" \
            --binary-name "$BINARY_NAME" \
            --target "$TARGET" \
            --candidate "$GITHUB_SHA" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-event "$GITHUB_EVENT_NAME" \
            --source-ref "$GITHUB_REF" \
            --source-tree "$source_tree" \
            --source-main-proven "$SOURCE_MAIN_PROVEN" \
            --manifest "$MANIFEST_PATH" \
            --lockfile templates/single-crate-public-stdio-server/Cargo.lock \
            --inventory release-inputs/tool-inventory.json \
            --schema release-inputs/tool-schema.json \
            --sbom templates/single-crate-public-stdio-server/release-sbom.cdx.json \
            --output-dir dist)
          python3 scripts/native_release_artifact.py verify \
            --archive "$archive" \
            --binary-name "$BINARY_NAME" \
            --target "$TARGET" \
            --candidate "$GITHUB_SHA" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-event "$GITHUB_EVENT_NAME" \
            --source-ref "$GITHUB_REF" \
            --source-tree "$source_tree" \
            --source-main-proven "$SOURCE_MAIN_PROVEN" \
            --manifest "$MANIFEST_PATH" \
            --lockfile templates/single-crate-public-stdio-server/Cargo.lock
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Upload SHA-qualified unprivileged proof artifact
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-stdio-template-${{ matrix.target }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  verify-native-template:
    name: Verify template cross-architecture contract
    needs:
      - prepare-template-inputs
      - build-native-template
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BINARY_NAME: single-crate-public-stdio-server
      MANIFEST_PATH: templates/single-crate-public-stdio-server/Cargo.toml
    steps:
      - name: Checkout exact candidate
        # actions/checkout v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Prove protected-main ancestry for trusted sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin +refs/heads/main:refs/remotes/origin/main
          source_main_proven=$(python3 scripts/native_release_artifact.py prove-source \
            --repository . \
            --candidate "$GITHUB_SHA" \
            --source-event "$GITHUB_EVENT_NAME" \
            --source-ref "$GITHUB_REF")
          echo "SOURCE_MAIN_PROVEN=$source_main_proven" >> "$GITHUB_ENV"

      - name: Download immutable template lockfile
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: native-stdio-template-source-inputs-${{ github.sha }}
          path: templates/single-crate-public-stdio-server

      - name: Download exact native template artifacts
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: native-stdio-template-*-unknown-linux-gnu-${{ github.sha }}
          path: downloaded
          merge-multiple: true

      - name: Download exact Apple native template artifacts
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: native-stdio-template-*-apple-darwin-${{ github.sha }}
          path: downloaded
          merge-multiple: true

      - name: Download exact Windows native template artifacts
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: native-stdio-template-*-pc-windows-msvc-${{ github.sha }}
          path: downloaded
          merge-multiple: true

      - name: Verify archives and cross-architecture tool equality
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source_tree=$(git rev-parse HEAD^{tree})
          archive_name() {
            python3 scripts/native_release_artifact.py archive-name \
              --binary-name "$BINARY_NAME" \
              --target "$1" \
              --candidate "$GITHUB_SHA"
          }
          x86_archive="downloaded/$(archive_name x86_64-unknown-linux-gnu)"
          arm_archive="downloaded/$(archive_name aarch64-unknown-linux-gnu)"
          mac_x86_archive="downloaded/$(archive_name x86_64-apple-darwin)"
          mac_arm_archive="downloaded/$(archive_name aarch64-apple-darwin)"
          windows_archive="downloaded/$(archive_name x86_64-pc-windows-msvc)"
          python3 scripts/native_release_artifact.py compare \
            --archive "$x86_archive" \
            --target x86_64-unknown-linux-gnu \
            --archive "$arm_archive" \
            --target aarch64-unknown-linux-gnu \
            --archive "$mac_x86_archive" \
            --target x86_64-apple-darwin \
            --archive "$mac_arm_archive" \
            --target aarch64-apple-darwin \
            --archive "$windows_archive" \
            --target x86_64-pc-windows-msvc \
            --binary-name "$BINARY_NAME" \
            --candidate "$GITHUB_SHA" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-event "$GITHUB_EVENT_NAME" \
            --source-ref "$GITHUB_REF" \
            --source-tree "$source_tree" \
            --source-main-proven "$SOURCE_MAIN_PROVEN" \
            --manifest "$MANIFEST_PATH" \
            --lockfile templates/single-crate-public-stdio-server/Cargo.lock \
            --output native-template-verification.json
          test "$(find downloaded -maxdepth 1 -type f | wc -l)" -eq 10

      - name: Upload SHA-qualified template verification report
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-stdio-template-verification-${{ github.sha }}
          path: native-template-verification.json
          if-no-files-found: error
          retention-days: 14
