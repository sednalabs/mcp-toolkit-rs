name: rust-2024-compatibility

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-2024-compatibility::${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-2024-compatibility-changes:
    name: Rust 2024 compatibility relevance
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.relevance.outputs.relevant }}
    steps:
      - name: Checkout repository
        # actions/checkout v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Rust 2024 compatibility-relevant changes
        id: relevance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import PurePosixPath

          def matches(path: str, pattern: str) -> bool:
              candidate = PurePosixPath(path)
              if candidate.match(pattern):
                  return True
              if pattern.startswith("**/"):
                  return candidate.match(pattern[3:])
              return False

          patterns = [
              "**/Cargo.toml",
              "**/Cargo.lock",
              "**/*.rs",
              "rust-toolchain*",
              ".github/workflows/rust-2024-compatibility.yml",
          ]
          event_name = os.environ["EVENT_NAME"]
          relevant = event_name == "workflow_dispatch"
          changed_files: list[str] = []

          if not relevant:
              if event_name == "pull_request":
                  base = os.environ["BASE_SHA"]
              else:
                  base = os.environ["BEFORE_SHA"]
              head = os.environ["HEAD_SHA"]

              if base and base != "0" * 40:
                  changed_files = [
                      line
                      for line in subprocess.check_output(
                          ["git", "diff", "--name-only", base, head],
                          text=True,
                      ).splitlines()
                      if line
                  ]
                  relevant = any(
                      matches(path, pattern)
                      for path in changed_files
                      for pattern in patterns
                  )
              else:
                  relevant = True

          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"relevant={'true' if relevant else 'false'}\n")

          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary_path, "a", encoding="utf-8") as handle:
              handle.write("### Rust 2024 compatibility relevance\n\n")
              handle.write(f"- Event: `{event_name}`\n")
              handle.write(f"- Relevant: `{'true' if relevant else 'false'}`\n")
              if changed_files:
                  handle.write("- Changed files considered:\n")
                  for path in changed_files:
                      handle.write(f"  - `{path}`\n")
          PY

  rust-2024-compatibility-lane:
    name: Rust 2024 compatibility / ${{ matrix.target.name }}
    runs-on: ubuntu-24.04
    needs: [rust-2024-compatibility-changes]
    if: ${{ needs.rust-2024-compatibility-changes.outputs.relevant == 'true' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: workspace
            cache_key: workspace
            workspaces: |
              . -> target
            check_cmd: cargo check --workspace --all-targets --all-features
          - name: curated-stdio-intent-server
            cache_key: template-curated-stdio-intent-server
            workspaces: |
              templates/curated-stdio-intent-server -> target
            check_cmd: cargo check --manifest-path templates/curated-stdio-intent-server/Cargo.toml --all-targets --all-features
          - name: hosted-http-auth-server
            cache_key: template-hosted-http-auth-server
            workspaces: |
              templates/hosted-http-auth-server -> target
            check_cmd: cargo check --manifest-path templates/hosted-http-auth-server/Cargo.toml --all-targets --all-features
          - name: single-crate-public-stdio-server
            cache_key: template-single-crate-public-stdio-server
            workspaces: |
              templates/single-crate-public-stdio-server -> target
            check_cmd: cargo check --manifest-path templates/single-crate-public-stdio-server/Cargo.toml --all-targets --all-features
    steps:
      - name: Checkout repository
        # actions/checkout v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Cache cargo artifacts
        # swatinem/rust-cache v2
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: rust-2024-compatibility-${{ runner.os }}-${{ matrix.target.cache_key }}
          workspaces: ${{ matrix.target.workspaces }}
          cache-on-failure: "true"
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Check Rust 2024 compatibility
        env:
          RUSTFLAGS: "-Wrust-2024-compatibility -Dwarnings"
        run: ${{ matrix.target.check_cmd }}

  rust-2024-compatibility:
    name: Rust 2024 compatibility guard
    runs-on: ubuntu-24.04
    needs: [rust-2024-compatibility-changes, rust-2024-compatibility-lane]
    if: ${{ always() }}
    steps:
      - name: Require every compatibility lane to pass
        shell: bash
        run: |
          if [[ "${{ needs.rust-2024-compatibility-changes.outputs.relevant }}" != "true" ]]; then
            echo "Rust 2024 compatibility checks were not relevant for this change."
            exit 0
          fi
          if [[ "${{ needs.rust-2024-compatibility-lane.result }}" != "success" ]]; then
            echo "One or more Rust 2024 compatibility lanes failed." >&2
            exit 1
          fi
          echo "All Rust 2024 compatibility lanes passed."
