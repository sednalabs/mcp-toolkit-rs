name: cargo-package-readiness

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cargo-package-readiness::${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-package-readiness-metadata:
    name: Cargo package readiness / metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve target metadata
        shell: bash
        run: |
          set -euo pipefail

          target_sha="$(git rev-parse HEAD)"
          {
            echo "### Cargo package readiness"
            echo
            echo "- Validation posture: \`first-wave package readiness\`"
            echo "- Target ref: \`${GITHUB_REF_NAME}\`"
            echo "- Target SHA: \`${target_sha}\`"
            echo "- Publication posture: \`no publish\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate package metadata
        run: python3 scripts/cargo_package_readiness.py --manifest-only

  cargo-package-readiness-package:
    name: Cargo package readiness / ${{ matrix.package.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: mcp-toolkit-core
            verify_cmd: |
              cargo package --package mcp-toolkit-core --list
              cargo package --package mcp-toolkit-core
          - name: mcp-toolkit-observability
            verify_cmd: |
              cargo package --package mcp-toolkit-observability --list
              cargo package --package mcp-toolkit-observability
          - name: mcp-toolkit-policy-core
            verify_cmd: |
              cargo package --package mcp-toolkit-policy-core --list
              cargo package --package mcp-toolkit-policy-core
          - name: mcp-toolkit-http
            verify_cmd: |
              cargo package --package mcp-toolkit-http --list
              cargo package --package mcp-toolkit-http
          - name: mcp-toolkit-testing
            verify_cmd: cargo package --package mcp-toolkit-testing --list
          - name: mcp-toolkit-policy-conformance
            verify_cmd: cargo package --package mcp-toolkit-policy-conformance --list
          - name: mcp-toolkit-auth
            verify_cmd: cargo package --package mcp-toolkit-auth --list
    steps:
      - name: Checkout
        # actions/checkout v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Cache cargo artifacts
        # swatinem/rust-cache v2
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: cargo-package-readiness-${{ runner.os }}
          workspaces: |
            . -> target
            templates/curated-stdio-intent-server -> target
            templates/hosted-http-auth-server -> target
            templates/single-crate-public-stdio-server -> target
          cache-on-failure: "true"
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Verify package readiness lane
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.package.verify_cmd }}

  cargo-package-readiness:
    name: First-wave Cargo package readiness
    runs-on: ubuntu-24.04
    needs:
      - cargo-package-readiness-metadata
      - cargo-package-readiness-package
    if: ${{ always() }}
    steps:
      - name: Require metadata and package lanes to pass
        shell: bash
        run: |
          if [[ "${{ needs.cargo-package-readiness-metadata.result }}" != "success" ]]; then
            echo "Cargo package metadata validation failed." >&2
            exit 1
          fi
          if [[ "${{ needs.cargo-package-readiness-package.result }}" != "success" ]]; then
            echo "One or more Cargo package readiness lanes failed." >&2
            exit 1
          fi
          echo "All Cargo package readiness lanes passed."
