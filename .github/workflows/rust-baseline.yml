name: rust-baseline

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: rust-baseline::${{ github.event_name }}::${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-runner-policy:
    name: Workflow runner policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Enforce standard GitHub-hosted runner labels
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/workflow_runner_policy_check.py \
            --self-test \
            --root . \
            --root templates/curated-stdio-intent-server \
            --root templates/hosted-http-auth-server \
            --root templates/single-crate-public-stdio-server
          for template in \
            curated-stdio-intent-server \
            hosted-http-auth-server \
            single-crate-public-stdio-server
          do
            helper="templates/$template/scripts/workflow_runner_policy_check.py"
            cmp scripts/workflow_runner_policy_check.py "$helper"
            python3 "$helper" --self-test --root "templates/$template"
          done

      - name: Validate baseline and coverage test ownership
        run: python3 scripts/check_rust_baseline_workflow.py

  rust-baseline-lane:
    name: Rust baseline / ${{ matrix.lane.target_name }} / ${{ matrix.lane.phase_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane:
          - target_name: workspace
            phase_name: fmt
            cache_key: workspace
            workspaces: |
              . -> target
            command: cargo fmt --all --check
          - target_name: workspace
            phase_name: clippy
            cache_key: workspace
            workspaces: |
              . -> target
            command: cargo clippy --workspace --all-targets --all-features -- -D warnings
          - target_name: curated-stdio-intent-server
            phase_name: fmt
            cache_key: template-curated-stdio-intent-server
            workspaces: |
              templates/curated-stdio-intent-server -> target
            command: cargo fmt --manifest-path templates/curated-stdio-intent-server/Cargo.toml --all --check
          - target_name: curated-stdio-intent-server
            phase_name: clippy
            cache_key: template-curated-stdio-intent-server
            workspaces: |
              templates/curated-stdio-intent-server -> target
            command: cargo clippy --manifest-path templates/curated-stdio-intent-server/Cargo.toml --all-targets --all-features -- -D warnings
          - target_name: curated-stdio-intent-server
            phase_name: tests
            cache_key: template-curated-stdio-intent-server
            workspaces: |
              templates/curated-stdio-intent-server -> target
            command: cargo test --manifest-path templates/curated-stdio-intent-server/Cargo.toml --all-targets --all-features
          - target_name: hosted-http-auth-server
            phase_name: fmt
            cache_key: template-hosted-http-auth-server
            workspaces: |
              templates/hosted-http-auth-server -> target
            command: cargo fmt --manifest-path templates/hosted-http-auth-server/Cargo.toml --all --check
          - target_name: hosted-http-auth-server
            phase_name: clippy
            cache_key: template-hosted-http-auth-server
            workspaces: |
              templates/hosted-http-auth-server -> target
            command: cargo clippy --manifest-path templates/hosted-http-auth-server/Cargo.toml --all-targets --all-features -- -D warnings
          - target_name: hosted-http-auth-server
            phase_name: tests
            cache_key: template-hosted-http-auth-server
            workspaces: |
              templates/hosted-http-auth-server -> target
            command: cargo test --manifest-path templates/hosted-http-auth-server/Cargo.toml --all-targets --all-features
          - target_name: single-crate-public-stdio-server
            phase_name: fmt
            cache_key: template-single-crate-public-stdio-server
            workspaces: |
              templates/single-crate-public-stdio-server -> target
            command: cargo fmt --manifest-path templates/single-crate-public-stdio-server/Cargo.toml --all --check
          - target_name: single-crate-public-stdio-server
            phase_name: clippy
            cache_key: template-single-crate-public-stdio-server
            workspaces: |
              templates/single-crate-public-stdio-server -> target
            command: cargo clippy --manifest-path templates/single-crate-public-stdio-server/Cargo.toml --all-targets --all-features -- -D warnings
          - target_name: single-crate-public-stdio-server
            phase_name: tests
            cache_key: template-single-crate-public-stdio-server
            workspaces: |
              templates/single-crate-public-stdio-server -> target
            command: cargo test --manifest-path templates/single-crate-public-stdio-server/Cargo.toml --all-targets --all-features
    steps:
      - name: Checkout
        # actions/checkout v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve target metadata
        shell: bash
        run: |
          set -euo pipefail

          target_sha="$(git rev-parse HEAD)"
          {
            echo "### Targeted Rust baseline"
            echo
            echo "- Target: \`${{ matrix.lane.target_name }}\`"
            echo "- Phase: \`${{ matrix.lane.phase_name }}\`"
            echo "- Validation posture: \`targeted baseline\`"
            echo "- Target ref: \`${GITHUB_REF_NAME}\`"
            echo "- Target SHA: \`${target_sha}\`"
            echo "- Setup class: \`rust-only\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        if: ${{ matrix.lane.phase_name != 'fmt' && (matrix.lane.target_name != 'workspace' || matrix.lane.phase_name != 'clippy') }}
        # swatinem/rust-cache v2
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          shared-key: rust-baseline-${{ runner.os }}-${{ matrix.lane.cache_key }}
          workspaces: ${{ matrix.lane.workspaces }}
          cache-on-failure: "true"
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Cache Cargo home for workspace Clippy
        if: ${{ matrix.lane.target_name == 'workspace' && matrix.lane.phase_name == 'clippy' }}
        # swatinem/rust-cache v2
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          shared-key: rust-baseline-${{ runner.os }}-workspace-clippy-cargo-home-v1
          workspaces: |
            . -> target
          cache-targets: "false"
          cache-bin: "false"
          cache-on-failure: "true"

      - name: Compute workspace Clippy target cache key
        id: workspace-clippy-source
        if: ${{ matrix.lane.target_name == 'workspace' && matrix.lane.phase_name == 'clippy' }}
        shell: bash
        run: |
          set -euo pipefail
          source_hash="$(
            git ls-files -s -- Cargo.toml Cargo.lock rust-toolchain.toml .cargo crates |
              sha256sum |
              cut -d' ' -f1
          )"
          echo "source_hash=${source_hash}" >> "$GITHUB_OUTPUT"

      - name: Cache workspace Clippy target
        if: ${{ matrix.lane.target_name == 'workspace' && matrix.lane.phase_name == 'clippy' }}
        # actions/cache v6
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: rust-baseline-target-v1-${{ runner.os }}-workspace-clippy-${{ steps.workspace-clippy-source.outputs.source_hash }}
          restore-keys: |
            rust-baseline-target-v1-${{ runner.os }}-workspace-clippy-

      - name: Run baseline lane
        run: ${{ matrix.lane.command }}

  rust-baseline:
    name: Run targeted Rust baseline
    runs-on: ubuntu-24.04
    needs: [workflow-runner-policy, rust-baseline-lane]
    if: ${{ always() }}
    steps:
      - name: Require every baseline lane to pass
        shell: bash
        run: |
          if [[ "${{ needs.workflow-runner-policy.result }}" != "success" ]]; then
            echo "Workflow runner policy failed." >&2
            exit 1
          fi
          if [[ "${{ needs.rust-baseline-lane.result }}" != "success" ]]; then
            echo "One or more Rust baseline lanes failed." >&2
            exit 1
          fi
          echo "Workflow runner policy and Rust baseline lanes passed."
