name: rust-msrv

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-msrv::${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-msrv:
    name: Rust MSRV / ${{ matrix.target.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: workspace
            manifest: Cargo.toml
          - name: curated-stdio-intent-server
            manifest: templates/curated-stdio-intent-server/Cargo.toml
          - name: hosted-http-auth-server
            manifest: templates/hosted-http-auth-server/Cargo.toml
          - name: single-crate-public-stdio-server
            manifest: templates/single-crate-public-stdio-server/Cargo.toml
    steps:
      - name: Checkout
        # actions/checkout v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust MSRV toolchain
        # dtolnay/rust-toolchain stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.88.0

      - name: Check MSRV compatibility
        env:
          CARGO_TERM_COLOR: always
        run: cargo check --manifest-path "${{ matrix.target.manifest }}" --all-targets --all-features
