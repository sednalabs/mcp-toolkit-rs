name: RMCP 3.8 migration qualification (temporary, read-only)
on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/rmcp-migration-qualification.yml"
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Rust 1.99
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - name: Resolve officially released RMCP and latest compatible dependencies
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback
          cargo update
      - name: Export reviewed-candidate Cargo.lock for independent commit
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib
          lockfile=pathlib.Path("Cargo.lock").read_bytes()
          print("RESOLVED_LOCKFILE_SHA256="+hashlib.sha256(lockfile).hexdigest())
          print("CARGO_LOCKFILE_BASE64_BEGIN")
          enc=base64.b64encode(lockfile).decode("ascii")
          for pos in range(0,len(enc),240):
              print("LOCK:",enc[pos:pos+240],sep="")
          print("CARGO_LOCKFILE_BASE64_END")
          PY
      - name: Compile current SDK candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo check --workspace --all-targets
