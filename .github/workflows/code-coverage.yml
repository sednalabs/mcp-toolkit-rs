name: code-coverage

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-coverage::${{ github.event_name }}::${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-coverage-lane:
    name: Rust coverage / ${{ matrix.target.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: workspace
            cache_key: workspace
            workspaces: |
              . -> target
            coverage_cmd: cargo llvm-cov --workspace --all-targets --all-features --cobertura --output-path coverage/workspace.xml
            coverage_file: coverage/workspace.xml
            coverage_label: code-coverage/cargo-workspace
            artifact_name: rust-cobertura-coverage-workspace
          - name: curated-stdio-intent-server
            cache_key: template-curated-stdio-intent-server
            workspaces: |
              templates/curated-stdio-intent-server -> target
            coverage_cmd: cargo llvm-cov --manifest-path templates/curated-stdio-intent-server/Cargo.toml --all-targets --all-features --cobertura --output-path coverage/curated-stdio-intent-server.xml
            coverage_file: coverage/curated-stdio-intent-server.xml
            coverage_label: code-coverage/template-curated-stdio-intent-server
            artifact_name: rust-cobertura-coverage-curated-stdio-intent-server
          - name: hosted-http-auth-server
            cache_key: template-hosted-http-auth-server
            workspaces: |
              templates/hosted-http-auth-server -> target
            coverage_cmd: cargo llvm-cov --manifest-path templates/hosted-http-auth-server/Cargo.toml --all-targets --all-features --cobertura --output-path coverage/hosted-http-auth-server.xml
            coverage_file: coverage/hosted-http-auth-server.xml
            coverage_label: code-coverage/template-hosted-http-auth-server
            artifact_name: rust-cobertura-coverage-hosted-http-auth-server
          - name: single-crate-public-stdio-server
            cache_key: template-single-crate-public-stdio-server
            workspaces: |
              templates/single-crate-public-stdio-server -> target
            coverage_cmd: cargo llvm-cov --manifest-path templates/single-crate-public-stdio-server/Cargo.toml --all-targets --all-features --cobertura --output-path coverage/single-crate-public-stdio-server.xml
            coverage_file: coverage/single-crate-public-stdio-server.xml
            coverage_label: code-coverage/template-single-crate-public-stdio-server
            artifact_name: rust-cobertura-coverage-single-crate-public-stdio-server
    steps:
      - name: Checkout repository
        # actions/checkout v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Cache cargo artifacts
        # swatinem/rust-cache v2
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          shared-key: code-coverage-v2-${{ runner.os }}-${{ matrix.target.cache_key }}
          workspaces: ${{ matrix.target.workspaces }}
          cache-on-failure: "true"
          cache-all-crates: "false"
          cache-workspace-crates: "false"

      - name: Install coverage tool
        # taiki-e/install-action v2
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: |
          mkdir -p coverage
          ${{ matrix.target.coverage_cmd }}

      - name: Upload Cobertura report
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.target.artifact_name }}
          path: ${{ matrix.target.coverage_file }}
          if-no-files-found: error

      - name: Summarize coverage report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("${{ matrix.target.coverage_file }}")
          root = ElementTree.parse(report).getroot()
          line_rate = float(root.attrib.get("line-rate", "0"))
          print("### Rust coverage")
          print()
          print(f"- Lane: `${{ matrix.target.name }}`")
          print(f"- Report: `{report}`")
          print(f"- Line coverage: {line_rate * 100:.2f}%")
          PY

      - name: Upload coverage to GitHub Code Quality
        # actions/upload-code-coverage v1
        # Code Quality is an optional, billable repository capability. Keep
        # coverage generation, artifacts, and the aggregate gate independent
        # from its availability; when explicitly enabled, upload failures
        # remain fatal to this lane.
        if: ${{ vars.CODE_QUALITY_UPLOAD_ENABLED == 'true' }}
        uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34
        with:
          file: ${{ matrix.target.coverage_file }}
          language: Rust
          label: ${{ matrix.target.coverage_label }}

      - name: Record Code Quality upload status
        if: ${{ vars.CODE_QUALITY_UPLOAD_ENABLED != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "GitHub Code Quality upload skipped: CODE_QUALITY_UPLOAD_ENABLED is not exactly 'true'."
          {
            echo "### GitHub Code Quality"
            echo
            echo "Upload skipped because repository variable CODE_QUALITY_UPLOAD_ENABLED is not exactly true."
          } >> "$GITHUB_STEP_SUMMARY"

  rust-coverage:
    name: Rust Cobertura coverage
    runs-on: ubuntu-24.04
    needs: [rust-coverage-lane]
    if: ${{ always() }}
    steps:
      - name: Checkout repository
        # actions/checkout v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate coverage workflow contract
        run: python3 scripts/check_code_coverage_workflow.py

      - name: Require every coverage lane to pass
        shell: bash
        run: |
          if [[ "${{ needs.rust-coverage-lane.result }}" != "success" ]]; then
            echo "One or more Rust coverage lanes failed." >&2
            exit 1
          fi
          echo "All Rust coverage lanes passed."
