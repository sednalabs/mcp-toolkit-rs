name: DevSkim

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "20 23 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devskim::${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: DevSkim
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        # actions/checkout v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run DevSkim scanner
        # Microsoft DevSkim Action v1
        uses: microsoft/DevSkim-Action@4b5047945a44163b94642a1cecc0d93a3f428cc6
        with:
          # Loopback hosts are intentional in this MCP server toolkit's auth,
          # host-validation, streamable HTTP, and template contract tests.
          exclude-rules: DS162092

      - name: Upload DevSkim scan results to GitHub code scanning
        # github/codeql-action v4
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          sarif_file: devskim-results.sarif
