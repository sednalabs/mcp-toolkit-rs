name: codeql-query-tests

on:
  # Branch protection requires the gate context on every pull request. Keep the
  # PR trigger unfiltered so required checks are not skipped for non-workflow
  # changes.
  pull_request: {}
  push:
    branches:
      - main
    paths:
      - ".github/codeql/actions-workflow-security/**"
      - ".github/codeql/rust-toolkit-contract/**"
      - ".github/codeql/codeql-python.yml"
      - ".github/codeql/codeql-rust.yml"
      - ".github/scripts/test_codeql_static_workflow.py"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/codeql-query-tests.yml"
      - "templates/single-crate-public-stdio-server/.github/codeql/actions-workflow-security/**"
      - "templates/single-crate-public-stdio-server/.github/workflows/codeql.yml"
      - "templates/single-crate-public-stdio-server/.github/workflows/codeql-query-tests.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

concurrency:
  group: codeql-query-tests::${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions-workflow-security:
    name: Actions workflow security query tests / ${{ matrix.pack.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pack:
          - name: repository-pack
            search_path: .github/codeql
            pack_path: .github/codeql/actions-workflow-security
            suite_path: .github/codeql/actions-workflow-security/suites/actions-workflow-security.qls
            query_glob: .github/codeql/actions-workflow-security/*.ql
          - name: public-stdio-template-pack
            search_path: templates/single-crate-public-stdio-server/.github/codeql
            pack_path: templates/single-crate-public-stdio-server/.github/codeql/actions-workflow-security
            suite_path: templates/single-crate-public-stdio-server/.github/codeql/actions-workflow-security/suites/actions-workflow-security.qls
            query_glob: templates/single-crate-public-stdio-server/.github/codeql/actions-workflow-security/*.ql
    steps:
      - name: Checkout repository
        # actions/checkout v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up CodeQL
        # github/codeql-action v4
        id: setup-codeql
        uses: github/codeql-action/setup-codeql@8aad20d150bbac5944a9f9d289da16a4b0d87c1e

      - name: Install query pack dependencies
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.setup-codeql.outputs.codeql-path }}" pack install "${{ matrix.pack.pack_path }}"

      - name: Resolve Actions workflow security suite
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.setup-codeql.outputs.codeql-path }}" resolve queries \
            --search-path "${{ matrix.pack.search_path }}" \
            "${{ matrix.pack.suite_path }}"

      - name: Compile Actions workflow security queries
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.setup-codeql.outputs.codeql-path }}" query compile \
            --search-path "${{ matrix.pack.search_path }}" \
            ${{ matrix.pack.query_glob }}

  rust-toolkit-contract:
    name: Rust toolkit contract query tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        # actions/checkout v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up CodeQL
        # github/codeql-action v4
        id: setup-codeql
        uses: github/codeql-action/setup-codeql@8aad20d150bbac5944a9f9d289da16a4b0d87c1e

      - name: Install Rust toolkit contract query pack dependencies
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.setup-codeql.outputs.codeql-path }}" pack install .github/codeql/rust-toolkit-contract

      - name: Resolve Rust toolkit contract suite
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.setup-codeql.outputs.codeql-path }}" resolve queries \
            --search-path .github/codeql \
            .github/codeql/rust-toolkit-contract/suites/rust-toolkit-contract.qls

      - name: Compile Rust toolkit contract queries
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.setup-codeql.outputs.codeql-path }}" query compile \
            --search-path .github/codeql \
            .github/codeql/rust-toolkit-contract/queries/*.ql

      - name: Run Rust toolkit contract query tests
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.setup-codeql.outputs.codeql-path }}" test run \
            --search-path .github/codeql \
            .github/codeql/rust-toolkit-contract/test

  codeql-workflow-contract:
    name: CodeQL workflow coverage contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        # actions/checkout v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Validate static CodeQL workflow and configs
        shell: bash
        run: python3 .github/scripts/test_codeql_static_workflow.py

  actions-workflow-security-gate:
    # Retain this legacy context name because main branch protection requires it.
    name: Actions workflow security query tests
    runs-on: ubuntu-24.04
    needs:
      - actions-workflow-security
      - rust-toolkit-contract
      - codeql-workflow-contract
    if: ${{ always() }}
    steps:
      - name: Require every CodeQL query-test lane to pass
        shell: bash
        run: |
          set -euo pipefail
          echo "actions: ${{ needs.actions-workflow-security.result }}"
          echo "rust   : ${{ needs.rust-toolkit-contract.result }}"
          echo "static : ${{ needs.codeql-workflow-contract.result }}"
          if [[ "${{ needs.actions-workflow-security.result }}" != "success" ||
                "${{ needs.rust-toolkit-contract.result }}" != "success" ||
                "${{ needs.codeql-workflow-contract.result }}" != "success" ]]; then
            echo "One or more CodeQL query-test lanes failed." >&2
            exit 1
          fi
          echo "All CodeQL query and workflow-contract lanes passed."
