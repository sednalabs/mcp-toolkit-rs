[package]
name = "mcp-toolkit-policy-conformance"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Conformance helpers for validating Rust MCP policy contracts."
repository = "https://github.com/sednalabs/mcp-toolkit-rs"
documentation = "https://docs.rs/mcp-toolkit-policy-conformance"
readme = "../../README.md"
publish = false

[package.metadata.docs.rs]
all-features = true

[lib]
path = "src/lib.rs"

[dependencies]
jsonschema = "0.18"
mcp-toolkit-policy-core = { version = "0.1.0", path = "../mcp-toolkit-policy-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
