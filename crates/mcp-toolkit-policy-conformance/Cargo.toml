[package]
name = "mcp-toolkit-policy-conformance"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Policy conformance helpers for the Sedna Labs MCP Toolkit for Rust."
repository = "https://github.com/sednalabs/mcp-toolkit-rs"
documentation = "https://docs.rs/mcp-toolkit-policy-conformance"
readme = "../../README.md"
keywords = ["mcp", "sednalabs", "rust", "conformance"]
categories = ["development-tools", "development-tools::testing"]
publish = false

[package.metadata.docs.rs]
all-features = true

[lib]
path = "src/lib.rs"

[dependencies]
jsonschema = "0.52"
mcp-toolkit-policy-core = { version = "0.1.0", path = "../mcp-toolkit-policy-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
