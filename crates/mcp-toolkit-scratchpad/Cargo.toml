[package]
name = "mcp-toolkit-scratchpad"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "DuckDB-backed scratchpad sessions for the Sedna Labs MCP Toolkit for Rust."
repository = "https://github.com/sednalabs/mcp-toolkit-rs"
documentation = "https://docs.rs/mcp-toolkit-scratchpad"
readme = "../../README.md"
keywords = ["mcp", "sednalabs", "rust", "duckdb"]
categories = ["database", "development-tools"]

[package.metadata.docs.rs]
all-features = true

[lib]
path = "src/lib.rs"

[features]
default = []
tokio = ["dep:tokio"]

[dependencies]
duckdb = { version = "1.4.4", default-features = false, features = ["bundled"] }
mcp-toolkit-observability = { version = "0.1.0", path = "../mcp-toolkit-observability", features = ["tracing-bridge"] }
mcp-toolkit-policy-core = { version = "0.1.0", path = "../mcp-toolkit-policy-core" }
serde_json = "1.0.149"
tempfile = "3.25.0"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "rt"], optional = true }
tracing = "0.1.44"
