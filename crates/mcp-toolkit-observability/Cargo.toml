[package]
name = "mcp-toolkit-observability"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Observability, metric, and telemetry helpers for Rust MCP services."
repository = "https://github.com/sednalabs/mcp-toolkit-rs"
documentation = "https://docs.rs/mcp-toolkit-observability"
readme = "../../README.md"
publish = false

[package.metadata.docs.rs]
all-features = true

[lib]
path = "src/lib.rs"

[features]
default = []
tracing-bridge = []
metrics-facade = ["dep:metrics"]
otel-export = [
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:tracing-opentelemetry",
]

[dependencies]
metrics = { version = "0.24", optional = true }
once_cell = "1.19"
opentelemetry = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", optional = true, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.32.1", optional = true, features = ["rt-tokio"] }
regex = "1"
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.33", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry"] }

[dev-dependencies]
trybuild = "1"
