[package]
name = "mcp-toolkit-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Core types and protocol-facing primitives for Rust MCP projects."
repository = "https://github.com/sednalabs/mcp-toolkit-rs"
documentation = "https://docs.rs/mcp-toolkit-core"
readme = "../../README.md"
publish = false

[package.metadata.docs.rs]
all-features = true

[lib]
path = "src/lib.rs"

[dependencies]
rmcp = "=1.8.0"
serde = "1.0.228"
serde_json = "1.0.149"
