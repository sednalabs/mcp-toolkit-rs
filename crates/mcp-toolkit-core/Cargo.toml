[package]
name = "mcp-toolkit-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Core protocol types and primitives for the Sedna Labs MCP Toolkit for Rust."
repository = "https://github.com/sednalabs/mcp-toolkit-rs"
documentation = "https://docs.rs/mcp-toolkit-core"
readme = "../../README.md"
keywords = ["mcp", "sednalabs", "rust", "protocol"]
categories = ["data-structures", "development-tools"]

[package.metadata.docs.rs]
all-features = true

[lib]
path = "src/lib.rs"

[dependencies]
rmcp = "=3.2.0"
serde = "1.0.228"
serde_json = "1.0.149"
