[package]
name = "mcp-toolkit-gemini"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sednalabs/mcp-rs-toolkit"

[lib]
path = "src/lib.rs"

[dependencies]
rmcp = { version = "1.5.0", features = ["server", "macros", "schemars"] }
schemars = "1.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["io-util", "process", "time"] }
tokio-util = "0.7.18"
