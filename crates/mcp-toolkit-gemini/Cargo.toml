[package]
name = "mcp-toolkit-gemini"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/sednalabs/mcp-toolkit-rs"

[lib]
path = "src/lib.rs"

[dependencies]
http = "1.3.1"
mcp-toolkit-auth = { version = "0.1.0", path = "../mcp-toolkit-auth" }
mcp-toolkit-core = { version = "0.1.0", path = "../mcp-toolkit-core" }
rmcp = { version = "1.7.0", features = ["server", "macros", "schemars"] }
schemars = "1.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = "0.7.18"
