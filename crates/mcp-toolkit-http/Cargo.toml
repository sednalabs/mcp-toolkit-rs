[package]
name = "mcp-toolkit-http"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "HTTP, OAuth discovery, and session helpers for Rust MCP services."
repository = "https://github.com/sednalabs/mcp-toolkit-rs"
documentation = "https://docs.rs/mcp-toolkit-http"
readme = "../../README.md"
publish = false

[package.metadata.docs.rs]
all-features = true

[lib]
path = "src/lib.rs"

[features]
session = [
  "dep:axum",
  "dep:futures",
  "dep:http-body-util",
  "dep:rmcp",
  "dep:tokio",
  "dep:tracing",
]
session-sqlite = [
  "session",
  "dep:rusqlite",
  "dep:aes-gcm",
  "dep:base64",
  "dep:rand_core",
]

[dependencies]
axum = { version = "0.8.8", optional = true }
http = "1.3.1"
http-body-util = { version = "0.1.3", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
url = "2.5.4"
futures = { version = "0.3.31", optional = true }
rmcp = { version = "=3.1.2", default-features = false, features = ["base64", "macros", "server", "transport-streamable-http-server", "transport-streamable-http-server-session"], optional = true }
tokio = { version = "1.49.0", features = ["sync"], optional = true }
tracing = { version = "0.1.44", optional = true }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
aes-gcm = { version = "0.10.3", optional = true }
base64 = { version = "0.22.1", optional = true }
rand_core = { version = "0.6.4", optional = true }

[dev-dependencies]
bytes = "1.10.1"
http-body-util = "0.1.3"
