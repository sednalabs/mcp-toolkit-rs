[package]
name = "mcp-toolkit-http"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "Apache-2.0"
description = "HTTP and session helpers for the Sedna Labs MCP Toolkit for Rust."
repository = "https://github.com/sednalabs/mcp-toolkit-rs"
documentation = "https://docs.rs/mcp-toolkit-http"
readme = "../../README.md"
keywords = ["mcp", "sednalabs", "rust", "http"]
categories = ["network-programming", "web-programming"]

[package.metadata.docs.rs]
all-features = true

[lib]
path = "src/lib.rs"

[features]
webhook-egress = ["chatgpt-events", "dep:reqwest", "dep:rustls", "dep:webpki-roots", "dep:tokio", "tokio/net", "tokio/rt", "tokio/time"]
chatgpt-events = ["dep:base64", "dep:mcp-toolkit-core", "dep:standardwebhooks", "dep:subtle", "dep:time"]
session = [
  "dep:axum",
  "dep:futures",
  "dep:http-body-util",
  "dep:rmcp",
  "dep:tokio",
  "dep:tracing",
]
session-sqlite = [
  "session",
  "dep:rusqlite",
  "dep:aes-gcm",
  "dep:base64",
  "dep:getrandom",
]

[dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1.0.11", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"], optional = true }
mcp-toolkit-core = { path = "../mcp-toolkit-core", version = "0.1.0", optional = true }
standardwebhooks = { version = "=1.0.1", optional = true }
subtle = { version = "2.6.1", optional = true }
time = { version = "0.3.55", features = ["formatting"], optional = true }
axum = { version = "0.8.8", optional = true }
http = "1.3.1"
http-body-util = { version = "0.1.3", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
url = "2.5.4"
futures = { version = "0.3.31", optional = true }
getrandom = { version = "0.4.3", optional = true }
rmcp = { version = "=3.9.0", default-features = false, features = ["base64", "macros", "server", "transport-streamable-http-server", "transport-streamable-http-server-session"], optional = true }
tokio = { version = "1.49.0", features = ["sync"], optional = true }
tracing = { version = "0.1.44", optional = true }
rusqlite = { version = "0.41.1", features = ["bundled"], optional = true }
aes-gcm = { version = "0.11.1", optional = true }
base64 = { version = "0.23.1", optional = true }

[dev-dependencies]
getrandom = "0.4.3"
bytes = "1.10.1"
http-body-util = "0.1.3"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
