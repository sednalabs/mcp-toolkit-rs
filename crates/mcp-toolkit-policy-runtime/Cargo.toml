[package]
name = "mcp-toolkit-policy-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Runtime policy authority and cache helpers for Rust MCP services."
repository = "https://github.com/sednalabs/mcp-toolkit-rs"
readme = "../../README.md"
publish = false

[features]
default = []
http = [
  "dep:axum",
  "dep:futures-util",
  "dep:http",
  "dep:mcp-toolkit-auth",
  "dep:serde_json",
  "dep:tower",
]

[lib]
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8.8", optional = true }
futures-util = { version = "0.3.31", optional = true }
http = { version = "1.3.1", optional = true }
mcp-toolkit-auth = { version = "0.1.0", path = "../mcp-toolkit-auth", optional = true }
mcp-toolkit-policy-core = { version = "0.1.0", path = "../mcp-toolkit-policy-core" }
mcp-toolkit-policy-ffi = { version = "0.1.0", path = "../mcp-toolkit-policy-ffi" }
mcp-toolkit-policy-kernel-adapters = { version = "0.1.0", path = "../mcp-toolkit-policy-kernel-adapters" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
tower = { version = "0.5.2", optional = true }

[dev-dependencies]
jsonwebtoken = { version = "10.3.0", features = ["aws_lc_rs"] }
serde_json = "1"
tokio = { version = "1.49.0", features = ["macros", "rt"] }
tower = { version = "0.5.2", features = ["util"] }
