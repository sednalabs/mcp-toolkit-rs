[package]
name = "mcp-toolkit-provenance"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Build provenance, runtime attestation, and startup admission helpers for Rust MCP services."
repository = "https://github.com/sednalabs/mcp-toolkit-rs"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
