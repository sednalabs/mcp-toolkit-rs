[package]
name = "mcp-toolkit-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Composable server bootstrap helpers for Rust MCP services."
repository = "https://github.com/sednalabs/mcp-rs-toolkit"
readme = "../../README.md"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
full = ["stdio", "http", "auth"]
stdio = ["dep:rmcp", "dep:tokio", "rmcp/server", "rmcp/transport-io"]
http = [
  "dep:axum",
  "dep:http",
  "dep:mcp-toolkit-http",
  "dep:rmcp",
  "dep:serde_json",
  "dep:tokio",
  "dep:tokio-util",
  "mcp-toolkit-http/session",
  "rmcp/server",
  "rmcp/transport-streamable-http-server",
]
auth = ["dep:mcp-toolkit-auth", "dep:tower", "http"]

[dependencies]
axum = { version = "0.8.8", optional = true }
http = { version = "1.3.1", optional = true }
mcp-toolkit-auth = { version = "0.1.0", path = "../mcp-toolkit-auth", optional = true }
mcp-toolkit-http = { version = "0.1.0", path = "../mcp-toolkit-http", optional = true }
rmcp = { version = "=1.5.0", default-features = false, optional = true }
serde_json = { version = "1.0.149", optional = true }
tokio = { version = "1.49.0", optional = true }
tokio-util = { version = "0.7.17", optional = true }
tower = { version = "0.5.2", optional = true }

[dev-dependencies]
bytes = "1.10.1"
http-body-util = "0.1.3"
rmcp = { version = "=1.5.0", default-features = false, features = ["macros", "schemars", "server", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.49.0", features = ["macros", "rt", "time"] }
tower = { version = "0.5.2", features = ["util"] }
