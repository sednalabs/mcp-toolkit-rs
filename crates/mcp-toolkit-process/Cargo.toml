[package]
name = "mcp-toolkit-process"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "Apache-2.0"
description = "Process and signal helpers for Rust MCP services."
repository = "https://github.com/sednalabs/mcp-toolkit-rs"
readme = "../../README.md"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
libc = "0.2.180"
tokio = { version = "1.49.0", features = ["io-util", "process", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.49.0", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
