[package]
name = "mcp-toolkit-policy-kernel-adapters"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sednalabs/mcp-toolkit-rs"

[lib]
path = "src/lib.rs"

[features]
default = []
conformance = ["dep:mcp-toolkit-policy-conformance"]

[dependencies]
mcp-toolkit-policy-core = { version = "0.1.0", path = "../mcp-toolkit-policy-core" }
mcp-toolkit-policy-conformance = { version = "0.1.0", path = "../mcp-toolkit-policy-conformance", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
