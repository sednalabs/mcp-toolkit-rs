[package]
name = "mcp-toolkit-policy-ffi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Optional SPARK runtime loader for policy decisions."
repository = "https://github.com/sednalabs/mcp-rs-toolkit"

[lib]
path = "src/lib.rs"

[dependencies]
libloading = "0.8"
serde_json = "1"
mcp-toolkit-policy-core = { version = "0.1.0", path = "../mcp-toolkit-policy-core" }
mcp-toolkit-policy-kernel-adapters = { version = "0.1.0", path = "../mcp-toolkit-policy-kernel-adapters" }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
