[package]
name = "mcp-toolkit-testing"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Testing helpers for Rust MCP server and tool-surface contracts."
repository = "https://github.com/sednalabs/mcp-toolkit-rs"
documentation = "https://docs.rs/mcp-toolkit-testing"
readme = "../../README.md"
publish = false

[package.metadata.docs.rs]
all-features = true

[lib]
path = "src/lib.rs"

[dependencies]
http = "1.3.1"
mcp-toolkit-core = { version = "0.1.0", path = "../mcp-toolkit-core" }
mcp-toolkit-http = { version = "0.1.0", path = "../mcp-toolkit-http" }
serde = "1.0.228"
serde_json = "1.0.149"

[dev-dependencies]
rmcp = { version = "=3.1.4", default-features = false }
