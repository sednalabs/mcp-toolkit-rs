[workspace]

[package]
name = "hosted-http-auth-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
axum = "0.8.9"
http = "1.3.1"
mcp-toolkit = { path = "../../crates/mcp-toolkit", features = ["server-auth"] }
mcp-toolkit-auth = { path = "../../crates/mcp-toolkit-auth" }
mcp-toolkit-core = { path = "../../crates/mcp-toolkit-core" }
rmcp = { version = "=1.8.0", default-features = false, features = ["macros", "schemars", "server", "transport-streamable-http-server"] }
rmcp-macros = "=1.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
http-body-util = "0.1.3"
mcp-toolkit-testing = { path = "../../crates/mcp-toolkit-testing" }
tower = { version = "0.5.3", features = ["util"] }
