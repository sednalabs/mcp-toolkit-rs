[workspace]

[package]
name = "single-crate-public-stdio-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "Apache-2.0"
publish = false
description = "Standalone public Rust MCP server starter with hosted CI, governance, and dual-native Linux release artifacts."

[dependencies]
mcp-toolkit = { path = "../../crates/mcp-toolkit", features = ["server-stdio"] }
mcp-toolkit-core = { path = "../../crates/mcp-toolkit-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
mcp-toolkit-testing = { path = "../../crates/mcp-toolkit-testing" }
tempfile = "=3.27.0"

# Cargo does not inherit the toolkit root patch into generated applications.
[patch.crates-io]
rmcp = { git = "https://github.com/sednalabs/rust-sdk", rev = "31e83f4f752001d2afc386254a4d17b5eab5f419" } # DevSkim: ignore DS173237 because this immutable public commit ID is source identity, not a credential.
rmcp-macros = { git = "https://github.com/sednalabs/rust-sdk", rev = "31e83f4f752001d2afc386254a4d17b5eab5f419" } # DevSkim: ignore DS173237 because this immutable public commit ID is source identity, not a credential.
