[workspace]

[package]
name = "single-crate-public-stdio-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Standalone public Rust MCP server starter with hosted CI, CodeQL, coverage, and dependency governance."

[dependencies]
mcp-toolkit = { path = "../../crates/mcp-toolkit", features = ["server-stdio"] }
mcp-toolkit-core = { path = "../../crates/mcp-toolkit-core" }
rmcp = { version = "=1.7.0", default-features = false, features = ["macros", "schemars", "server", "transport-io"] }
rmcp-macros = "=1.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
mcp-toolkit-testing = { path = "../../crates/mcp-toolkit-testing" }
