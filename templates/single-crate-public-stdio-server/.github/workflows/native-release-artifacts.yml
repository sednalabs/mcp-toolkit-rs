name: native-release-artifacts

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]*"

concurrency:
  group: native-release-artifacts::${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-native-linux:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    env:
      BINARY_NAME: single-crate-public-stdio-server
      CARGO_CYCLONEDX_VERSION: 0.5.9
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout exact trusted candidate
        # actions/checkout v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Authorize immutable main or version-tag source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/v[0-9]*) ;;
            *) echo "release artifacts require a main push or version tag" >&2; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$GITHUB_SHA^{tree}")"
          test -f Cargo.lock

      - name: Enforce standard GitHub-hosted runner labels
        shell: bash
        run: python3 scripts/workflow_runner_policy_check.py --self-test

      - name: Verify release helper contracts
        run: python3 scripts/native_release_artifact.py --self-test

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Verify native target
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$TARGET"

      - name: Cache cargo artifacts
        # swatinem/rust-cache v2
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: native-release-${{ matrix.target }}

      - name: Build locked native binary
        shell: bash
        run: cargo build --release --locked --target "$TARGET" --bin "$BINARY_NAME"

      - name: Capture canonical tool surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-inputs
          python3 scripts/native_release_artifact.py capture \
            --binary "target/$TARGET/release/$BINARY_NAME" \
            --inventory-output release-inputs/tool-inventory.json \
            --schema-output release-inputs/tool-schema.json

      - name: Install pinned CycloneDX generator
        run: cargo install cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION" --locked

      - name: Generate target-specific CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          cargo cyclonedx \
            --format json \
            --manifest-path Cargo.toml \
            --override-filename release-sbom.cdx \
            --spec-version 1.5 \
            --target "$TARGET"
          test -f release-sbom.cdx.json

      - name: Package and verify exact artifact
        shell: bash
        run: |
          set -euo pipefail
          source_tree=$(git rev-parse HEAD^{tree})
          mkdir -p dist
          archive=$(python3 scripts/native_release_artifact.py package \
            --binary "target/$TARGET/release/$BINARY_NAME" \
            --binary-name "$BINARY_NAME" \
            --target "$TARGET" \
            --candidate "$GITHUB_SHA" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-event "$GITHUB_EVENT_NAME" \
            --source-ref "$GITHUB_REF" \
            --source-tree "$source_tree" \
            --manifest Cargo.toml \
            --lockfile Cargo.lock \
            --inventory release-inputs/tool-inventory.json \
            --schema release-inputs/tool-schema.json \
            --sbom release-sbom.cdx.json \
            --output-dir dist)
          python3 scripts/native_release_artifact.py verify \
            --archive "$archive" \
            --binary-name "$BINARY_NAME" \
            --target "$TARGET" \
            --candidate "$GITHUB_SHA" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-event "$GITHUB_EVENT_NAME" \
            --source-ref "$GITHUB_REF" \
            --source-tree "$source_tree" \
            --manifest Cargo.toml \
            --lockfile Cargo.lock
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Upload SHA-qualified native artifact
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-linux-${{ matrix.target }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  verify-native-linux:
    name: Verify cross-architecture release contract
    needs: build-native-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BINARY_NAME: single-crate-public-stdio-server
    steps:
      - name: Checkout exact trusted candidate
        # actions/checkout v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download exact native artifacts
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: native-linux-*-${{ github.sha }}
          path: downloaded
          merge-multiple: true

      - name: Verify archives and cross-architecture tool equality
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source_tree=$(git rev-parse HEAD^{tree})
          x86_archive="downloaded/$BINARY_NAME-x86_64-unknown-linux-gnu-$GITHUB_SHA.tar.gz"
          arm_archive="downloaded/$BINARY_NAME-aarch64-unknown-linux-gnu-$GITHUB_SHA.tar.gz"
          python3 scripts/native_release_artifact.py compare \
            --archive "$x86_archive" \
            --target x86_64-unknown-linux-gnu \
            --archive "$arm_archive" \
            --target aarch64-unknown-linux-gnu \
            --binary-name "$BINARY_NAME" \
            --candidate "$GITHUB_SHA" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-event "$GITHUB_EVENT_NAME" \
            --source-ref "$GITHUB_REF" \
            --source-tree "$source_tree" \
            --manifest Cargo.toml \
            --lockfile Cargo.lock \
            --output native-release-verification.json
          test "$(find downloaded -maxdepth 1 -type f | wc -l)" -eq 4

      - name: Upload SHA-qualified verification report
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-linux-verification-${{ github.sha }}
          path: native-release-verification.json
          if-no-files-found: error
          retention-days: 14

  attest-native-linux:
    name: Attest verified trusted release artifacts
    needs:
      - build-native-linux
      - verify-native-linux
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      BINARY_NAME: single-crate-public-stdio-server
    steps:
      - name: Checkout exact trusted candidate
        # actions/checkout v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download verified artifact set
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: native-linux-*-${{ github.sha }}
          path: downloaded
          merge-multiple: true

      - name: Reverify trusted consumer artifact set
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/v[0-9]*) ;;
            *) echo "attestation requires a main push or version tag" >&2; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source_tree=$(git rev-parse HEAD^{tree})
          x86_archive="downloaded/$BINARY_NAME-x86_64-unknown-linux-gnu-$GITHUB_SHA.tar.gz"
          arm_archive="downloaded/$BINARY_NAME-aarch64-unknown-linux-gnu-$GITHUB_SHA.tar.gz"
          python3 scripts/native_release_artifact.py compare \
            --archive "$x86_archive" \
            --target x86_64-unknown-linux-gnu \
            --archive "$arm_archive" \
            --target aarch64-unknown-linux-gnu \
            --binary-name "$BINARY_NAME" \
            --candidate "$GITHUB_SHA" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-event "$GITHUB_EVENT_NAME" \
            --source-ref "$GITHUB_REF" \
            --source-tree "$source_tree" \
            --manifest Cargo.toml \
            --lockfile Cargo.lock \
            --output trusted-verification.json
          cmp trusted-verification.json downloaded/native-release-verification.json
          test "$(find downloaded -maxdepth 1 -type f | wc -l)" -eq 5
          python3 scripts/native_release_artifact.py authorize \
            --verification trusted-verification.json \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output release-authorization.json

      - name: Attest verified native archives, checksums, and report
        # actions/attest-build-provenance v4.2.2
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            downloaded/*.tar.gz
            downloaded/*.tar.gz.sha256
            downloaded/native-release-verification.json
            release-authorization.json

      - name: Upload attested release authorization receipt
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-linux-authorization-${{ github.sha }}
          path: release-authorization.json
          if-no-files-found: error
          retention-days: 14
