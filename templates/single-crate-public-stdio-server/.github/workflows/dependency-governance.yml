name: dependency-governance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-governance::${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-governance-changes:
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.relevance.outputs.relevant }}
    steps:
      - name: Checkout
        # actions/checkout v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect dependency-governance-relevant changes
        id: relevance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import PurePosixPath

          def matches(path: str, pattern: str) -> bool:
              candidate = PurePosixPath(path)
              if candidate.match(pattern):
                  return True
              if pattern.startswith("**/"):
                  return candidate.match(pattern[3:])
              return False

          patterns = [
              "Cargo.toml",
              "Cargo.lock",
              "deny.toml",
              "scripts/dependency_governance_check.sh",
              "scripts/rmcp_macro_runtime_pin_check.py",
              "docs/dependency-governance.md",
              ".github/workflows/dependency-governance.yml",
          ]
          event_name = os.environ["EVENT_NAME"]
          relevant = event_name == "workflow_dispatch"
          changed_files: list[str] = []

          if not relevant:
              if event_name == "pull_request":
                  base = os.environ["BASE_SHA"]
              else:
                  base = os.environ["BEFORE_SHA"]
              head = os.environ["HEAD_SHA"]

              if base and base != "0" * 40:
                  changed_files = [
                      line
                      for line in subprocess.check_output(
                          ["git", "diff", "--name-only", base, head],
                          text=True,
                      ).splitlines()
                      if line
                  ]
                  relevant = any(
                      matches(path, pattern)
                      for path in changed_files
                      for pattern in patterns
                  )
              else:
                  relevant = True

          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"relevant={'true' if relevant else 'false'}\n")
          PY

  dependency-governance-lane:
    runs-on: ubuntu-24.04
    needs: [dependency-governance-changes]
    if: ${{ needs.dependency-governance-changes.outputs.relevant == 'true' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Cache cargo artifacts
        # swatinem/rust-cache v2
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Install governance tools
        # taiki-e/install-action v2
        uses: taiki-e/install-action@b8cecb83565409bcc297b2df6e77f030b2a468d5
        with:
          tool: cargo-deny,cargo-audit,cargo-outdated

      - name: Run dependency governance checks
        env:
          STRICT_OUTDATED: "0"
        run: ./scripts/dependency_governance_check.sh

  dependency-governance:
    runs-on: ubuntu-24.04
    needs: [dependency-governance-changes, dependency-governance-lane]
    if: ${{ always() }}
    steps:
      - name: Require dependency-governance result
        shell: bash
        run: |
          if [[ "${{ needs.dependency-governance-changes.outputs.relevant }}" != "true" ]]; then
            echo "Dependency governance checks were not relevant for this change."
            exit 0
          fi
          if [[ "${{ needs.dependency-governance-lane.result }}" != "success" ]]; then
            echo "Dependency governance checks failed." >&2
            exit 1
          fi
          echo "Dependency governance checks passed."
