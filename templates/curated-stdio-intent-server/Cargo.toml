[workspace]

[package]
name = "curated-stdio-intent-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[dependencies]
mcp-toolkit = { path = "../../crates/mcp-toolkit", features = ["server-stdio"] }
mcp-toolkit-core = { path = "../../crates/mcp-toolkit-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
mcp-toolkit-testing = { path = "../../crates/mcp-toolkit-testing" }
