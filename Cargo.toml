[workspace]
resolver = "2"
members = [
  "crates/mcp-toolkit",
  "crates/mcp-toolkit-core",
  "crates/mcp-toolkit-auth",
  "crates/mcp-toolkit-docs",
  "crates/mcp-toolkit-http",
  "crates/mcp-toolkit-logs",
  "crates/mcp-toolkit-observability",
  "crates/mcp-toolkit-policy-core",
  "crates/mcp-toolkit-policy-conformance",
  "crates/mcp-toolkit-policy-ffi",
  "crates/mcp-toolkit-policy-kernel-adapters",
  "crates/mcp-toolkit-policy-runtime",
  "crates/mcp-toolkit-postgres",
  "crates/mcp-toolkit-private-artifact",
  "crates/mcp-toolkit-process",
  "crates/mcp-toolkit-provenance",
  "crates/mcp-toolkit-scratchpad",
  "crates/mcp-toolkit-tasks",
  "crates/mcp-toolkit-testing",
  "crates/mcp-toolkit-server",
]

[workspace.package]
rust-version = "1.99"

# Cargo patch tables apply only to the workspace that declares them. They do not
# flow through this toolkit as a dependency; consumers needing this SDK correction
# must add their own root-level override until a compatible RMCP release exists.
[patch.crates-io]
rmcp = { git = "https://github.com/sednalabs/rust-sdk", rev = "82c9353cbc6098d177981f4355a6b645bab17506" } # DevSkim: ignore DS173237 because this immutable public commit ID is source identity, not a credential.
rmcp-macros = { git = "https://github.com/sednalabs/rust-sdk", rev = "82c9353cbc6098d177981f4355a6b645bab17506" } # DevSkim: ignore DS173237 because this immutable public commit ID is source identity, not a credential.
