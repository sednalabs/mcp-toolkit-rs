[workspace]
resolver = "2"
members = [
  "crates/mcp-toolkit",
  "crates/mcp-toolkit-core",
  "crates/mcp-toolkit-auth",
  "crates/mcp-toolkit-docs",
  "crates/mcp-toolkit-http",
  "crates/mcp-toolkit-logs",
  "crates/mcp-toolkit-observability",
  "crates/mcp-toolkit-policy-core",
  "crates/mcp-toolkit-policy-conformance",
  "crates/mcp-toolkit-policy-ffi",
  "crates/mcp-toolkit-policy-kernel-adapters",
  "crates/mcp-toolkit-policy-runtime",
  "crates/mcp-toolkit-postgres",
  "crates/mcp-toolkit-private-artifact",
  "crates/mcp-toolkit-process",
  "crates/mcp-toolkit-provenance",
  "crates/mcp-toolkit-scratchpad",
  "crates/mcp-toolkit-tasks",
  "crates/mcp-toolkit-testing",
  "crates/mcp-toolkit-server",
  "vendor/dpop-verifier",
]

[workspace.package]
rust-version = "1.99"

# RMCP 3.8.0 release plus narrowly maintained transport hardening.
# The official 3.8.0 source still lacks duplicate-Origin rejection,
# strict serialized Origin parsing, and the current-protocol no-SSE-replay carry.
# Replace this patch only after equivalent upstream fixes and tests are proven.
# Cargo patch tables do not propagate to downstream consumers. Consumers needing
# this hardening must declare the same immutable override in their root manifest.
[patch.crates-io]
rmcp = { git = "https://github.com/sednalabs/rust-sdk", rev = "623a757c7673a2294e2ab4f507be8a43d325be28" } # DevSkim: ignore DS173237 because this immutable public commit ID is source identity, not a credential.
rmcp-macros = { git = "https://github.com/sednalabs/rust-sdk", rev = "623a757c7673a2294e2ab4f507be8a43d325be28" } # DevSkim: ignore DS173237 because this immutable public commit ID is source identity, not a credential.
